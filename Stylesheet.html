<style>
:root{--navy:#142342;--navy-light:#24365e;--blue:#1465d8;--orange:#ff8700;--orange-dark:#df7200;--bg:#f3f5f8;--surface:#fff;--border:#d7dee7;--text:#182234;--muted:#667286;--green:#07845c;--shadow:0 10px 28px rgba(24,34,52,.08)}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,Arial,sans-serif;background:var(--bg)}button,input,select{font:inherit}
.topbar{height:68px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(24,34,52,.05);display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 20px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{font-size:40px;font-weight:900;line-height:1;color:var(--blue)}.brand-title{margin:0;font-size:17px;font-weight:800;letter-spacing:.06em}.brand-subtitle{margin:0;font-size:12px;color:var(--orange);font-weight:700}.source-note{color:var(--muted);font-size:13px}
.layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:214px;background:var(--navy);color:#fff;padding:28px 14px;flex-shrink:0}.sidebar-label{margin:0 10px 15px;color:#9eabca;font-size:12px}.nav-item{width:100%;border:0;background:transparent;color:#d8def0;text-align:left;font-weight:700;padding:14px;margin-bottom:4px;border-radius:8px;cursor:pointer}.nav-item.active,.nav-item:hover{color:#fff;background:var(--navy-light)}.sidebar-stats{margin:32px 10px 0;padding:18px 14px;border-top:1px solid rgba(255,255,255,.17);display:grid;gap:5px;color:#aeb9d1;font-size:12px}.sidebar-stats strong{color:#fff;font-size:28px;margin-bottom:10px}
.main{flex:1;padding:26px 30px 40px;min-width:0}.search-panel{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:24px 26px 22px}.search-title-row,.results-heading,.action-row{display:flex;align-items:center;justify-content:space-between}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;margin:0 0 4px}h1{font-size:24px;margin:0 0 24px}.ghost-button{color:var(--blue);border:1px solid var(--border);border-radius:5px;background:#fff;padding:9px 14px;cursor:pointer}.filter-row{display:flex;gap:14px}.filter-field{flex:1;display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:700}input,select{height:43px;border-radius:5px;border:1px solid var(--border);color:var(--text);background:#fff;padding:0 12px}
.keyword-builder{border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4;margin:21px 0;padding:16px 0 12px;display:grid;grid-template-columns:94px minmax(400px,1fr) 135px;gap:12px}.keyword-label{color:var(--muted);font-size:12px;font-weight:700;padding-top:13px}.keyword-row{display:grid;grid-template-columns:minmax(110px,160px) 26px minmax(120px,1fr) minmax(125px,155px) 34px;gap:8px;align-items:center;margin-bottom:9px}.equals{color:var(--muted);text-align:center}.remove-keyword,.close-button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}.outline-button{border:1px solid var(--border);border-radius:5px;height:43px;padding:0 12px;background:#fff;color:var(--blue);cursor:pointer}.salary-field{flex:1.5}.salary-inputs{display:flex;align-items:center;gap:8px}.salary-inputs input{min-width:85px;width:100%}.action-row{justify-content:center;margin-top:24px}.search-button{min-width:355px;height:54px;background:var(--orange);color:#fff;border:0;border-radius:6px;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(255,135,0,.28)}.search-button:hover{background:var(--orange-dark)}.search-button strong{font-size:24px}
.results{margin-top:27px}.results-heading{margin-bottom:16px}.results-heading h2{margin:0;font-size:20px}.results-heading strong{color:var(--blue);font-size:26px}.sort{color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}.sort select{height:38px}.result-grid{display:grid;gap:13px}.result-card{background:var(--surface);border:1px solid #e7ebf0;border-radius:8px;padding:18px 20px;display:grid;grid-template-columns:minmax(250px,1.3fr) minmax(190px,1fr) minmax(160px,.7fr) 118px;gap:18px;align-items:center}.result-card h3{margin:7px 0 6px;font-size:17px}.tag{display:inline-flex;border-radius:999px;background:#eaf7f2;color:var(--green);padding:3px 10px;font-size:12px;font-weight:700}.card-label{margin:0 0 5px;color:var(--muted);font-size:12px}.card-value{margin:0;font-size:14px}.salary{color:var(--orange-dark);font-weight:700;font-size:18px}.detail-button{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:5px;height:41px;cursor:pointer}.empty-message{background:#fff;padding:34px;text-align:center;border-radius:8px;color:var(--muted)}.error-message{color:#b42318}
.detail-dialog{width:min(900px,calc(100vw - 50px));border:0;border-radius:10px;padding:0;box-shadow:0 24px 70px rgba(0,0,0,.25)}.detail-dialog::backdrop{background:rgba(12,20,36,.54)}.dialog-header{padding:24px 28px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}.dialog-header h2{margin:5px 0 0;font-size:22px}.dialog-content{padding:21px 28px 27px;max-height:min(68vh,670px);overflow-y:auto}.detail-section{margin-bottom:21px}.detail-section h3{color:var(--navy);font-size:15px;border-left:4px solid var(--orange);margin:0 0 13px;padding-left:9px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 20px}.detail-item{background:#f7f8fa;padding:10px 12px;border-radius:5px}.detail-item dt{color:var(--muted);font-size:12px;margin-bottom:4px}.detail-item dd{margin:0;line-height:1.45;word-break:break-word}
@media(max-width:920px){.sidebar{display:none}.main{padding:18px 12px}.filter-row,.result-card{display:grid;grid-template-columns:1fr}.keyword-builder{display:block}.keyword-label{padding:0 0 9px}.keyword-row{grid-template-columns:1fr}.equals{display:none}.outline-button{width:100%}.search-button{min-width:100%}}
</style>
